# Zeerak Docker compose config.
#
# This keeps the example firewall posture, but also allows the local
# panel/API port published by docker compose for browser access.
version: 1

server:
  listen: 0.0.0.0:17878
  socket: /run/zeerak/zeerak.sock
  rollback_seconds: 60

tables:
  - family: inet
    name: zeerak-policy
    chains:
      - name: input
        type: filter
        hook: input
        priority: 0
        policy: drop
        rules:
          - expr: ct state established,related accept
            comment: conntrack
          - expr: iifname lo accept
            comment: loopback
          - expr: tcp dport 22 accept
            comment: ssh
          - expr: tcp dport { 80, 443 } accept
            comment: caddy
          - expr: tcp dport 17878 accept
            comment: panel
