# Release workflow — triggered by pushing a `v*` tag.
#
# Builds via goreleaser:
#   - tar.gz / zip archives + SHA256SUMS
#   - .deb / .rpm / .apk via nfpm
#   - multi-arch image -> ghcr.io/logicalangel/zeerak
#   - Homebrew tap formula -> logicalangel/homebrew-zeerak
#   - SBOMs (CycloneDX)
#
# All artifacts are attached to the GitHub Release.
#
# Requires repo secrets:
#   HOMEBREW_TAP_GITHUB_TOKEN  PAT with `repo` scope on logicalangel/homebrew-zeerak
#
# GHCR auth uses the workflow's GITHUB_TOKEN (no extra secret needed) since
# we push to `ghcr.io/<org>/<repo>` under the same org.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write    # publish GitHub Release
  packages: write    # push to GHCR
  id-token: write    # for cosign-keyless signing (future)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # goreleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: set up qemu (multi-arch docker)
        uses: docker/setup-qemu-action@v3

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
